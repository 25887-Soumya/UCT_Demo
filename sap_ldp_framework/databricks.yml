bundle:
  name: sap_ldp_framework

include:
  - resources/*.yml

variables:
  # ── Identity ─────────────────────────────────────────────────────────
  catalog:
    description: UC catalog for all output and control tables
    default: rgaplxdatabricks
  control_schema:
    description: Schema holding the control tables and the framework volume
    default: uct_demo
  schema:
    description: Default schema of the bronze and silver pipelines
    default: sap_demo_bronze
  pipeline_id:
    description: pipeline_name registered in pipeline_table_config
    default: customer
  environment:
    description: dev | qa | prod
    default: dev
  alert_email:
    description: Who gets registration alerts (empty = the registry's default list)
    default: ""

  # ── Paths: two locations only ────────────────────────────────────────
  #  1. SAP landing zone (source data, written by SAP Datasphere / JDBC)
  #  2. Framework root  (everything the framework itself writes or reads)
  #       {framework_root}/configs/    generated config JSON
  #       {framework_root}/sql_files/  gold SQL files
  #       {framework_root}/logs/       run logs
  #       {framework_root}/schema/     Auto Loader schema locations
  landing_base_path:
    description: >
      Landing zone root that pipeline_table_config.source_path is relative
      to (e.g. source_path PLAF/initial/ -> {landing_base_path}PLAF/initial/).
      SAP Datasphere and the JDBC extract both write below it.
    default: /Volumes/ingestion_test/landing/landing_volume/
  framework_root:
    description: One folder for configs, sql_files, logs and schema
    default: /Volumes/${var.catalog}/${var.control_schema}/landing

  # Kept so existing control jobs keep working; both follow framework_root.
  config_out_dir:
    description: Always {framework_root}/configs
    default: ${var.framework_root}/configs
  base_volume:
    description: Always {framework_root}
    default: ${var.framework_root}

  # ── Compute for the JDBC extract (classic job cluster) ───────────────
  jdbc_spark_version:
    description: Databricks Runtime for the JDBC extract cluster
    default: 15.4.x-scala2.12
  jdbc_node_type:
    description: VM size for the JDBC extract cluster
    default: Standard_D4ds_v5


targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405615385053650.10.azuredatabricks.net

  qa:
    mode: production
    workspace:
      host: https://adb-8848629306534274.14.azuredatabricks.net
      # Shared folder so qa is deployed once, not per user
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      environment: qa
      catalog: ingestion_cat                      # TODO: replace
      landing_base_path: /Volumes/ingestion_test/landing/landing_volume/   # TODO: replace
      # base_volume and config_out_dir derive from catalog + control_schema

  # prod:
