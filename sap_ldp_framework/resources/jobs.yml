# Main load job: source -> landing (optional) -> bronze -> silver -> gold.
# Replaces DATA_LOAD_SOURCE_TO_GOLD_split. No user paths, cluster IDs or
# pipeline UUIDs: notebooks are relative to this file, compute is
# serverless, and the pipeline IDs come from resources/pipelines.yml.
#
# Job parameters are passed to every notebook task automatically as
# widgets, so the tasks need no base_parameters.
resources:
  jobs:
    data_load_source_to_gold:
      name: DATA_LOAD_SOURCE_TO_GOLD_${bundle.target}
      max_concurrent_runs: 1
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED

      parameters:
        - name: pipeline_id
          default: ${var.pipeline_id}
        - name: environment
          default: ${var.environment}
        - name: catalog
          default: ${var.catalog}
        - name: control_schema
          default: ${var.control_schema}
        - name: framework_root
          default: ${var.framework_root}
        - name: config_out_dir
          default: ${var.config_out_dir}
        - name: landing_base_path
          default: ${var.landing_base_path}
        - name: bronze_pipeline_uuid
          default: ${resources.pipelines.bronze_pipeline.id}
        - name: silver_pipeline_uuid
          default: ${resources.pipelines.silver_pipeline.id}

      environments:
        - environment_key: notebook_environment
          spec:
            environment_version: "6"

      # Classic compute for the JDBC extract only. The source database is
      # usually reachable only from the workspace's own network, which
      # serverless cannot use unless network connectivity has been set up
      # for it. If serverless can reach the database, delete this block and
      # give Source_to_landing_jdbc "environment_key: notebook_environment".
      job_clusters:
        - job_cluster_key: jdbc_cluster
          new_cluster:
            spark_version: ${var.jdbc_spark_version}
            node_type_id: ${var.jdbc_node_type}
            num_workers: 1
            data_security_mode: SINGLE_USER

      tasks:
        - task_key: Configure_pipeline
          notebook_task:
            notebook_path: ../src/notebooks/configure_pipeline_split.py
          environment_key: notebook_environment

        - task_key: Check_skip_source_to_landing
          depends_on:
            - task_key: Configure_pipeline
          notebook_task:
            notebook_path: ../src/notebooks/check_skip_source_to_landing.py
          environment_key: notebook_environment

        - task_key: If_skip_source_to_landing
          depends_on:
            - task_key: Check_skip_source_to_landing
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.Check_skip_source_to_landing.values.skip_source_to_landing}}"
            right: "true"

        - task_key: Source_to_landing_jdbc
          depends_on:
            - task_key: If_skip_source_to_landing
              outcome: "false"
          notebook_task:
            notebook_path: ../src/notebooks/jdbc_extract_to_landing.py
          job_cluster_key: jdbc_cluster

        - task_key: Source_to_bronze
          depends_on:
            - task_key: If_skip_source_to_landing
              outcome: "true"
            - task_key: Source_to_landing_jdbc
          run_if: AT_LEAST_ONE_SUCCESS
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_pipeline.id}
            full_refresh: false

        - task_key: Bronze_to_silver
          depends_on:
            - task_key: Source_to_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_pipeline.id}
            full_refresh: false

        - task_key: Silver_to_gold
          depends_on:
            - task_key: Bronze_to_silver
          notebook_task:
            notebook_path: ../src/notebooks/gold_pipeline_split.py
          environment_key: notebook_environment
